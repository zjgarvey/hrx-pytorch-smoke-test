[pytest]
testpaths = tests
addopts = -ra -m "not stress"
# Generous global deadline: turns device-side hangs into failures, never gates
# healthy tests (full suite ~1 min). Stress tests share it: raise it or mark
# a slow stress test with @pytest.mark.timeout when running HRX_STRESS_SCALE>>1.
timeout = 900
# Hangs block in HIP C code; signal-based timeouts cannot interrupt that.
timeout_method = thread
required_plugins = pytest-timeout
markers =
    stress: long-running endurance/load tests (opt-in; excluded from the fast presubmit)
